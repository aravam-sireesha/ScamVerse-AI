<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 280px; font-family: -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 16px; }
    h1 { font-size: 14px; margin: 0 0 12px; display: flex; align-items: center; gap: 6px; }
    .status { padding: 12px; border-radius: 8px; font-size: 13px; font-weight: bold; text-align: center; margin-bottom: 10px; }
    .safe { background: #064e3b; color: #10b981; }
    .suspicious { background: #451a03; color: #f59e0b; }
    .dangerous { background: #450a0a; color: #ef4444; }
    .unknown { background: #1e293b; color: #94a3b8; }
    .detail { font-size: 11px; color: #94a3b8; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>🛡️ AI ScamShield</h1>
  <div id="status" class="status unknown">Checking this site...</div>
  <div id="detail" class="detail"></div>
  <script src="popup.js"></script>
</body>
</html>
